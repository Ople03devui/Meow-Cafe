<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Cafe - คาเฟ่แมวสุดน่ารัก</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🐈 Meow Cafe 🐾</h1>
        <p>ยินดีต้อนรับสู่ดินแดนของทาสแมว</p>
    </header>

    <main>
        <h2>ทำความรู้จักกับเจ้าถิ่น</h2>
        <div class="cat-container">
            <div class="cat-card">
                <img src="D:\Webcafecat\img\orange-cat-Persian.jpg" alt="น้องส้ม">
                <h3>น้องส้ม (เจ้าสัว)</h3>
                <p>นิสัย: กินเก่ง นอนทั้งวัน ชอบให้เกาพุง</p>
                <button class="meow-btn">ทักทายน้อง</button>
            </div>
            
            <div class="cat-card">
                <img src="D:\Webcafecat\img\images.jpg" alt="น้องสามสี">
                <h3>น้องสามสี (พาย)</h3>
                <p>นิสัย: ขี้อ้อน ชอบกระโดดขึ้นตัก</p>
                <button class="meow-btn">ทักทายน้อง</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
